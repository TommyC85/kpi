name: Varini settimanale (Corsi + Riacquisti)

on:
  schedule:
    # lunedì: build pesante ~40 min. Tanti tentativi notturni (GitHub ritarda molto e
    # in modo variabile) per completare entro le 06:00 UTC (08:00 Roma).
    # Il job "guard" qui sotto ferma i tentativi in eccesso una volta che uno è riuscito.
    - cron: "0 20 * * 0"   # domenica sera UTC
    - cron: "0 22 * * 0"
    - cron: "0 0 * * 1"
    - cron: "0 2 * * 1"
  push:
    branches: [main]   # rebuild on-demand: unica leva manuale (workflow_dispatch → 403)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read        # serve al guard per leggere lo storico dei run

concurrency:
  group: varini-weekly
  cancel-in-progress: false

jobs:
  # I 4 cron sono ridondanti per costruzione: servono a vincere i ritardi di GitHub,
  # non a rifare il lavoro 4 volte. Appena uno è andato a buon fine, i successivi
  # non hanno nulla da fare — e senza questo controllo fallivano rumorosamente
  # (mail "All jobs have failed") su un rebuild che era già superfluo.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Il giro di questa settimana è già riuscito?
        id: check
        if: github.event_name == 'schedule'   # push e dispatch ricostruiscono SEMPRE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(gh run list --workflow learndash.yml --branch main --status success \
                   --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ]; then
            echo "Nessun run riuscito in archivio → procedo."
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "Ultimo run riuscito: $last ($((age / 3600))h fa)."
          # La finestra dei tentativi va da dom 20:00 a lun 02:00 UTC, più i ritardi di
          # GitHub (fino a ~9h): 24h copre tutti i tentativi dello stesso giro e resta
          # ben lontana dai 7 giorni del giro successivo.
          if [ "$age" -lt 86400 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "→ Dati già aggiornati nelle ultime 24h: salto il rebuild."
          else
            echo "→ Dati più vecchi di 24h: procedo col rebuild."
          fi

  build-and-deploy:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Corsi — mappa persona→corsi + pagina (LearnDash, sola lettura)
        env:
          LD_VARINI_URL: ${{ secrets.LD_VARINI_URL }}
          LD_VARINI_USER: ${{ secrets.LD_VARINI_USER }}
          LD_VARINI_PASS: ${{ secrets.LD_VARINI_PASS }}
        run: python ld_run.py

      - name: Riacquisti — storico ordini Woo + pagina
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
        run: |
          python build_woo_orders.py
          python riacquisti_render.py

      - name: Deploy su SiteGround (FTPS) — /tommaso/kpi/{learndash,riacquisti}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mkdir -f -p '$FTP_DIR/kpi/learndash';
            put -O '$FTP_DIR/kpi/learndash' ld/index.html;
            put -O '$FTP_DIR/kpi/learndash' ld/.htaccess;
            mkdir -f -p '$FTP_DIR/kpi/riacquisti';
            put -O '$FTP_DIR/kpi/riacquisti' riacquisti/index.html;
            put -O '$FTP_DIR/kpi/riacquisti' riacquisti/.htaccess;
          "
