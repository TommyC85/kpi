name: KPI Dashboard

on:
  schedule:
    # GitHub ritarda i cron anche di 8-9h e in modo variabile → NON garantisce un orario.
    # Tanti tentativi notturni (workflow idempotente + concurrency-guarded) per far
    # completare almeno uno PRIMA delle 06:00 UTC (08:00 Roma).
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
    - cron: "30 3 * * *"
  push:
    branches: [main]   # rebuild+deploy on-demand: unica leva manuale (workflow_dispatch → 403)
  workflow_dispatch: {}

concurrency:
  group: kpi-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verifica secret (solo presenza e lunghezza, MAI i valori)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          for v in SUPABASE_URL SUPABASE_KEY WC_URL WC_KEY WC_SECRET FTP_HOST FTP_USER FTP_PASS FTP_DIR ODOO_URL ODOO_DB ODOO_USER ODOO_API_KEY; do
            val="${!v}"
            if [ -z "$val" ]; then echo "❌ $v = VUOTO"; else echo "✅ $v = presente (${#val} char)"; fi
          done

      - name: Genera dashboard KPI (scorecard 4 clienti)
        env:
          # Token Meta dal collegamento OAuth su Supabase (sola lettura).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          # WooCommerce Balducci (dati reali: clienti/incasso).
          WC_BALDUCCI_URL: ${{ secrets.WC_BALDUCCI_URL }}
          WC_BALDUCCI_KEY: ${{ secrets.WC_BALDUCCI_KEY }}
          WC_BALDUCCI_SECRET: ${{ secrets.WC_BALDUCCI_SECRET }}
          # Odoo Pontoni — SOLA LETTURA (funnel + trend costo/appuntamento).
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          # Google Ads Pontoni via foglio (webhook Apps Script, non API).
          # Se mancano, la riga Google degrada a "dati non disponibili": non rompe il giro.
          GADS_PONTONI_URL: ${{ secrets.GADS_PONTONI_URL }}
          GADS_PONTONI_TOKEN: ${{ secrets.GADS_PONTONI_TOKEN }}
        run: python kpi_run.py

      - name: Genera spaccato moduli Pontoni (Odoo)
        continue-on-error: true   # una fonte giù non deve far fallire il job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          # Serve anche qui: il blocco "AAG — Meta vs Google" della pagina
          # spaccato moduli legge la spesa Google dal foglio. Senza questi due
          # la colonna spesa resta vuota e €/fissato diventa "n.d.".
          GADS_PONTONI_URL: ${{ secrets.GADS_PONTONI_URL }}
          GADS_PONTONI_TOKEN: ${{ secrets.GADS_PONTONI_TOKEN }}
        run: python pontoni_run.py

      - name: Deploy su SiteGround (FTPS) — cartella /tommaso/kpi
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # KPI scorecard (sempre)
          lftp -c "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mkdir -f -p '$FTP_DIR/kpi'; cd '$FTP_DIR/kpi';
            put -O . kpi/index.html; put -O . kpi/.htaccess;
          "
          # Pontoni: solo se generato (se il build è fallito, lascio invariata la live)
          if [ -f pontoni/index.html ]; then
            lftp -c "
              set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
              open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
              mkdir -f -p '$FTP_DIR/kpi/pontoni'; cd '$FTP_DIR/kpi/pontoni';
              put -O . pontoni/index.html; put -O . pontoni/.htaccess;
            "
          else
            echo 'pontoni/index.html assente → deploy Pontoni saltato (live invariata)';
          fi
